<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt lại mật khẩu — KudoSkill</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lime: '#ccff00',
            blue: '#335AF5',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            tight: ['"Inter Tight"', 'Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { background: #111111; }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 100px #1e1e1e inset !important; -webkit-text-fill-color: #e8e8ea !important; }
    .input-field {
      width: 100%; background: #1a1a1a; border: 1px solid #2e2e33; border-radius: 10px;
      padding: 12px 14px; color: #e8e8ea; font-size: 14px; outline: none;
      transition: border-color 0.15s;
    }
    .input-field:focus { border-color: #ccff00; }
    .input-field::placeholder { color: #444; }
    .btn-lime {
      width: 100%; background: #ccff00; color: #111; border-radius: 10px;
      padding: 12px; font-family: 'Inter Tight', sans-serif; font-weight: 800;
      font-size: 15px; cursor: pointer; border: none; transition: opacity 0.15s;
    }
    .btn-lime:hover { opacity: 0.88; }
    .btn-lime:disabled { opacity: 0.4; cursor: not-allowed; }
    .alert { border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
    .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .alert-success { background: rgba(204,255,0,0.08); border: 1px solid rgba(204,255,0,0.25); color: #ccff00; }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

  <!-- Nav -->
  <nav class="px-6 py-4 flex items-center justify-between max-w-5xl mx-auto w-full">
    <a href="/" class="flex items-center gap-2 no-underline" style="text-decoration:none;">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="7" fill="#1e1e1e"/>
        <line x1="8" y1="6" x2="8" y2="22" stroke="#e8e8ea" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="14" x2="20" y2="6" stroke="#e8e8ea" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="14" x2="20" y2="22" stroke="#e8e8ea" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="11" x2="20" y2="6" stroke="#ccff00" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="20" cy="6" r="2.5" fill="#ccff00"/>
      </svg>
      <span style="font-family:'Inter Tight',sans-serif;font-weight:900;font-size:16px;color:#e8e8ea;">
        Kudo<span style="color:#ccff00;">Skill</span>
      </span>
    </a>
  </nav>

  <!-- Main -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div style="width:100%;max-width:400px;">

      <h1 style="font-family:'Inter Tight',sans-serif;font-weight:900;font-size:28px;color:#e8e8ea;text-align:center;margin-bottom:8px;">
        Đặt lại mật khẩu
      </h1>
      <p style="color:#71717a;font-size:14px;text-align:center;margin-bottom:32px;">
        Tạo mật khẩu mới cho tài khoản của bạn
      </p>

      <!-- Card -->
      <div style="background:#1a1a1a;border:1px solid #2e2e33;border-radius:16px;padding:28px;">

        <div id="alert" style="display:none;" class="alert"></div>

        <!-- Reset Form -->
        <div id="reset-form">
          <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;">
            <input id="new-password" type="password" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" class="input-field" autocomplete="new-password" />
            <input id="confirm-password" type="password" placeholder="Nhập lại mật khẩu mới" class="input-field" autocomplete="new-password" />
          </div>
          <button type="button" id="btn-reset" onclick="handleReset()" class="btn-lime">Đặt lại mật khẩu</button>
        </div>

        <!-- Success state -->
        <div id="success-state" style="display:none;text-align:center;">
          <div style="width:56px;height:56px;background:rgba(204,255,0,0.1);border:2px solid rgba(204,255,0,0.3);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px;">✓</div>
          <div style="font-size:16px;font-weight:700;color:#ccff00;margin-bottom:8px;">Đặt lại thành công!</div>
          <div style="font-size:13px;color:#71717a;">Đang chuyển hướng đến trang đăng nhập...</div>
        </div>

      </div>

      <p style="text-align:center;margin-top:20px;">
        <a href="/login" style="font-size:13px;color:#71717a;text-decoration:none;">← Quay lại đăng nhập</a>
      </p>

    </div>
  </main>

<script>
  const API = 'https://api.kudoskill.xyz/api/v1';

  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('alert').className = 'alert alert-error';
    document.getElementById('alert').textContent = 'Link đã hết hạn hoặc không hợp lệ.';
    document.getElementById('alert').style.display = '';
    document.getElementById('reset-form').style.display = 'none';
  }

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('alert');
    el.className = 'alert ' + (type === 'error' ? 'alert-error' : 'alert-success');
    el.textContent = msg;
    el.style.display = '';
  }

  async function handleReset() {
    const password = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    const btn = document.getElementById('btn-reset');

    if (!password || password.length < 6) { showAlert('Mật khẩu cần ít nhất 6 ký tự'); return; }
    if (password !== confirm) { showAlert('Mật khẩu nhập lại không khớp'); return; }

    btn.disabled = true; btn.textContent = 'Đang xử lý...';
    try {
      const res = await fetch(`${API}/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error?.message || 'Có lỗi xảy ra.');

      document.getElementById('reset-form').style.display = 'none';
      document.getElementById('success-state').style.display = '';
      setTimeout(() => { window.location.href = '/login'; }, 2000);
    } catch (err) {
      showAlert(err.message);
      btn.disabled = false; btn.textContent = 'Đặt lại mật khẩu';
    }
  }
</script>
</body>
</html>
