<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Đang xử lý — KudoSkill</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&display=swap" rel="stylesheet" />
  <style>
    body { background: #111111; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; font-family: 'Inter Tight', sans-serif; }
    .box { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid #2e2e33; border-top-color: #ccff00;
               border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #71717a; font-size: 14px; margin-top: 8px; }
    h2 { color: #e8e8ea; font-size: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Đang đăng nhập...</h2>
    <p id="msg">Vui lòng chờ trong giây lát</p>
  </div>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (token) {
    localStorage.setItem('kudo_token', token);
    // Lấy thông tin user rồi lưu
    fetch('https://api.kudoskill.xyz/api/v1/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    })
      .then(r => r.json())
      .then(data => {
        if (data.success) localStorage.setItem('kudo_user', JSON.stringify(data.data.user));
        window.location.href = '/dashboard';
      })
      .catch(() => { window.location.href = '/dashboard'; });
  } else {
    document.getElementById('msg').textContent = 'Đăng nhập thất bại. Đang chuyển về trang đăng nhập...';
    setTimeout(() => { window.location.href = '/login'; }, 2000);
  }
</script>
</body>
</html>
